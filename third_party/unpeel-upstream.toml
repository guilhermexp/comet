# 2026-09-18 — Comet's durable project-identity projection is read by the
# vendored controller host without importing the adapter. The headless session
# action path also rejects restart/resume for an unavailable or archived
# checkout using the same raw namespace. The path-taking app-state writer
# exposes an explicit notification hook so an isolated reconciliation can
# announce a successful production write while fixtures remain silent. These
# local changes live in controller_host.rs, controller_api.rs, and app_state.rs;
# no upstream patch is implied.

# 2026-09-20 — controller_host retains reasons for registered projects omitted
# from the executable catalog; controller_api returns 409 with that reason,
# reserving unknown-project 400 for IDs that were never registered.

# 2026-09-21 — Native initial prompt for the four configured worker presets.
# `omp_native_initial` renamed to `native_initial` (no alias). Adapters declare
# FileArgument (OMP/Pi) or PositionalPrompt (Claude/Codex). Prepare attaches
# only with a body (`@file` or `--` + quoted text; never `$(cat)`). Host claims
# `.pending` → `.claimed` immediately before spawn/PTY write via
# submit_with_native_reservation; ACK after success must not drop the child.
# Native is PasteAndSubmit-only. Stored Session.command is unchanged; restart
# does not replay. Codex command-wrapper.sh no longer logs argv; normal hook
# install overwrites a stale managed asset. Does not bump
# local_modifications_count.
#
# 2026-09-22 — Real Codex startup exposed upstream-launcher PATH recursion.
# Before exec, the managed wrapper removes only PATH entries resolving to
# itself by file identity; configured upstream executable/argv remain intact.
# The external-launcher regression runs in worker_initial_briefing.
#
# 2026-09-22 — session_host initializes the PTY and terminal viewport with the
# same launch geometry. A fixed 80x24 viewport lost final answers emitted by a
# 120x40 worker before desktop attach. Proven via the Comet adapter and real OMP.
#
# 2026-09-24 — Host create accepts an optional `title` (whitespace-collapsed,
# control characters rejected, ≤256 bytes) that becomes the Session label with
# custom_title. Without it, native startup — which never crosses the PTY prompt
# auto-title — labels the Session from the briefing's first line via
# normalize_prompt_title. Workers launched after 2026-09-22 were all titled by
# their bare command. Change lives in controller_api.rs.
