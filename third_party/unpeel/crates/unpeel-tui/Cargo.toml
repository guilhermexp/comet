[package]
name = "unpeel-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Herdr-style terminal multiplexer view over Unpeel hosted sessions"

[[bin]]
name = "unpeel"
path = "src/main.rs"

[dependencies]
unpeel-core = { path = "../unpeel-core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
plist = "1"
uuid = { version = "1", features = ["v4"] }
aes-gcm = { version = "0.10.3", features = ["aes", "alloc"] }
hkdf = "0.12.4"
sha2 = "0.10.9"
base64 = { version = "0.23.1", features = ["std"] }
rand = { version = "0.9.5", features = ["std", "std_rng", "os_rng"] }
qrcode = { version = "0.14.1", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"
