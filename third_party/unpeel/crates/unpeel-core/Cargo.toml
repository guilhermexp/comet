[package]
name = "unpeel-core"
description = "Unpeel session backend: hosted PTY sessions, provider integrations, hook assets, MCP host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
portable-pty = "0.8"
libc = "0.2"
base64 = "0.22"
toml = "0.8"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.13"
sha1 = "0.10"
ring = "0.17"
webpki-roots = "0.26"
sha2 = "0.10"
md5 = "0.7"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
