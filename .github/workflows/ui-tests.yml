name: UI tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'crates/**'
      - 'apps/zeron/**'
      - 'apps/ios/**'
      - 'third_party/zui/**'
      - 'third_party/unpeel/**'
      - 'edge/**'
      - 'dist/macos/**'
      - '.github/actions/linux-ci/**'
      - 'scripts/ci/**'
      - 'scripts/*cursor-sdk*'
      - '.github/workflows/cursor-*.yml'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'scripts/test-browser-storage.py'
      - 'scripts/ios/**'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'crates/**'
      - 'apps/zeron/**'
      - 'apps/ios/**'
      - 'third_party/zui/**'
      - 'third_party/unpeel/**'
      - 'edge/**'
      - 'dist/macos/**'
      - '.github/actions/linux-ci/**'
      - 'scripts/ci/**'
      - 'scripts/*cursor-sdk*'
      - '.github/workflows/cursor-*.yml'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'scripts/test-browser-storage.py'
      - 'scripts/ios/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.select.outputs.ios }}
      ui: ${{ steps.select.outputs.ui }}
      core: ${{ steps.select.outputs.core }}
      linux_browser: ${{ steps.select.outputs.linux_browser }}
      macos: ${{ steps.select.outputs.macos }}
      macos_app_check: ${{ steps.select.outputs.macos_app_check }}
      macos_geometry: ${{ steps.select.outputs.macos_geometry }}
      macos_notify: ${{ steps.select.outputs.macos_notify }}
      macos_attachments: ${{ steps.select.outputs.macos_attachments }}
      macos_browser: ${{ steps.select.outputs.macos_browser }}
      macos_preview: ${{ steps.select.outputs.macos_preview }}
      macos_gpui: ${{ steps.select.outputs.macos_gpui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test UI lane selector
        run: python3 -m unittest scripts/ci/test_select_ui_tests.py
      - name: Test release profile gate
        run: node --test scripts/ci/release-profile-gate.test.cjs
      - name: Determine base commit
        id: base_commit
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('child_process');
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('mode', 'all');
              return;
            }
            if (context.eventName === 'pull_request') {
              const baseSha = context.payload.pull_request?.base?.sha;
              if (!baseSha) {
                core.setOutput('mode', 'all');
                return;
              }
              core.setOutput('mode', 'diff');
              core.setOutput('is_pr', 'true');
              core.setOutput('base_sha', baseSha);
              core.setOutput('head_sha', context.payload.pull_request?.head?.sha || 'HEAD');
              return;
            }
            if (context.eventName === 'push') {
              try {
                const branch = context.ref.replace('refs/heads/', '');
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'ui-tests.yml',
                  branch: branch,
                  status: 'completed',
                  per_page: 30,
                });
                const currentRunId = context.runId;
                const successfulRuns = (runs.data.workflow_runs || []).filter(
                  r => r.id !== currentRunId && r.conclusion === 'success' && r.head_sha
                );
                let ancestorSha = null;
                for (const run of successfulRuns) {
                  try {
                    execFileSync('git', ['merge-base', '--is-ancestor', run.head_sha, 'HEAD'], { stdio: 'ignore' });
                    ancestorSha = run.head_sha;
                    break;
                  } catch (e) {
                    // Not an ancestor, continue searching
                  }
                }
                if (ancestorSha) {
                  core.setOutput('mode', 'diff');
                  core.setOutput('is_pr', 'false');
                  core.setOutput('base_sha', ancestorSha);
                  core.setOutput('head_sha', 'HEAD');
                } else {
                  core.setOutput('mode', 'all');
                }
              } catch (err) {
                core.warning(`Failed to determine previous successful run: ${err.message}`);
                core.setOutput('mode', 'all');
              }
              return;
            }
            core.setOutput('mode', 'all');
      - name: Select UI test targets
        id: select
        run: |
          if [ "${{ steps.base_commit.outputs.mode }}" = "diff" ]; then
            PR_FLAG=""
            if [ "${{ steps.base_commit.outputs.is_pr }}" = "true" ]; then
              PR_FLAG="--pr"
            fi
            python3 scripts/ci/select-ui-tests.py \
              $PR_FLAG \
              --base "${{ steps.base_commit.outputs.base_sha }}" \
              --head "${{ steps.base_commit.outputs.head_sha }}" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/select-ui-tests.py --all --github-output "$GITHUB_OUTPUT"
          fi

  # Every Linux Rust test that is not UI: one build, one nextest run (see
  # scripts/ci/test-core.sh). Replaces session-sync-regressions and the Rust
  # steps of cursor-compatibility and preview-tests.
  core-tests:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core
          save-rust-cache: 'true'
      - name: Harness, engine, sync, update, doc and preview tests
        run: scripts/ci/test-core.sh

  ui-tests:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: ui
          save-rust-cache: 'true'
          apt-cache: gpui
          apt-packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libx11-dev libxcb1-dev libx11-xcb-dev
            libfontconfig1-dev libfreetype-dev libasound2-dev
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: UI and headless layout regressions
        run: cargo nextest run --config-file scripts/ci/nextest.toml --locked --no-fail-fast -p zeron-ui --lib --test voice_orb_geometry

  macos-frame-recovery:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    # A cold release build plus the feature-enabled browser fixtures exceeds 45m.
    # Keep the short execution timeouts on native regressions below.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: |
            .
            third_party/zui
      - name: Check macOS application
        if: needs.changes.outputs.macos_app_check == 'true'
        run: cargo check --release --locked -p zeron
      - name: Native diff font geometry regression
        if: needs.changes.outputs.macos_geometry == 'true'
        run: cargo test --release --locked -p zeron-ui --lib native_diff_font_geometry -- --test-threads=1
      - name: Native notification click regressions
        if: needs.changes.outputs.macos_notify == 'true'
        run: |
          cargo test --release --locked -p zeron-ui --lib notify::tests:: -- --test-threads=1
      - name: Native attachment and composer chip regressions
        if: needs.changes.outputs.macos_attachments == 'true'
        run: |
          for filter in attachments::tests:: composer::attachment_chip_tests:: shell::chat_dropzone_tests:: \
            queue_rows_label_attachment_chips_and_file_only_sends \
            user_bubbles_project_attachment_chips_in_place_of_the_strip \
            sent_chips_show_upload_progress_until_their_bytes_land; do
            cargo test --release --locked -p zeron-ui --lib "$filter" -- --test-threads=1
          done
      - name: Build native browser fixture
        if: needs.changes.outputs.macos_browser == 'true'
        run: cargo build --release --locked -p zeron-ui --example browser-fixture --features browser-fixture
      - name: Native browser regression and screenshots
        if: needs.changes.outputs.macos_browser == 'true'
        timeout-minutes: 3
        env:
          RUST_BACKTRACE: 1
          # Give the headed CI runner time to paint a frame during the 200ms
          # sidebar transition before the fixture samples native visibility.
          ZERON_MOTION_SCALE: 1.5
        run: |
          bash scripts/run-macos-browser-fixture.sh target/release/examples/browser-fixture "$RUNNER_TEMP/browser-captures"
          test -f "$RUNNER_TEMP/browser-captures/result.txt"
      - name: Persistent browser profiles across app launches
        if: needs.changes.outputs.macos_browser == 'true'
        timeout-minutes: 5
        run: python3 scripts/test-browser-storage.py --fixture target/release/examples/browser-fixture
      - name: Upload browser screenshots
        if: always() && needs.changes.outputs.macos_browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-macos-captures
          path: ${{ runner.temp }}/browser-captures
          if-no-files-found: ignore
      - name: Build native preview fixture
        if: needs.changes.outputs.macos_preview == 'true'
        run: cargo build --release --locked -p zeron-ui --example preview-fixture --features browser-fixture
      - name: Setup Node for preview
        if: needs.changes.outputs.macos_preview == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install preview fixture server
        if: needs.changes.outputs.macos_preview == 'true'
        run: npm ci --prefix edge
      - name: Project discovery, stable URLs and HMR in native WebKit
        if: needs.changes.outputs.macos_preview == 'true'
        timeout-minutes: 3
        env:
          ZERON_PREVIEW_AUTO_OPEN: 1
        run: |
          VITE_BINARY="$GITHUB_WORKSPACE/edge/node_modules/vite/bin/vite.js" bash scripts/run-macos-browser-fixture.sh target/release/examples/preview-fixture "$RUNNER_TEMP/preview-captures"
          test -f "$RUNNER_TEMP/preview-captures/result.txt"
      - name: Upload preview screenshots
        if: always() && needs.changes.outputs.macos_preview == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-macos-captures
          path: ${{ runner.temp }}/preview-captures
          if-no-files-found: ignore
      - name: Native frame-source recovery regression
        if: needs.changes.outputs.macos_gpui == 'true'
        working-directory: third_party/zui
        run: cargo test --release --locked -p gpui_macos --test frame_source_recovery
      - name: Build native window glass backing regression
        if: needs.changes.outputs.macos_gpui == 'true'
        working-directory: third_party/zui
        run: cargo test --release --locked -p gpui_macos --features runtime_shaders --test window_glass_backing --no-run --message-format=json > "$RUNNER_TEMP/window-glass-build.jsonl"
      - name: Run native window glass backing regression
        if: needs.changes.outputs.macos_gpui == 'true'
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, plistlib, shlex, shutil, subprocess
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'window-glass'
          evidence.mkdir()
          artifacts = [json.loads(line) for line in (evidence.parent / 'window-glass-build.jsonl').read_text().splitlines()]
          binary = next(pathlib.Path(item['executable']) for item in artifacts
                        if item.get('reason') == 'compiler-artifact'
                        and item.get('target', {}).get('name') == 'window_glass_backing'
                        and item.get('executable'))
          app = evidence / 'Native Glass Regression.app'
          contents = app / 'Contents'
          executable = contents / 'MacOS'
          executable.mkdir(parents=True)
          shutil.copy2(binary, executable / 'native-test')
          (contents / 'Info.plist').write_bytes(plistlib.dumps({
              'CFBundleIdentifier': 'sh.zeron.validation.window-glass-backing',
              'CFBundleName': 'Native Glass Regression',
              'CFBundleExecutable': 'run-fixture',
              'CFBundlePackageType': 'APPL', 'CFBundleVersion': '1',
              'NSHighResolutionCapable': True, 'NSSupportsAutomaticTermination': False,
          }))
          launcher = executable / 'run-fixture'
          launcher.write_text('#!/bin/sh\n' + shlex.quote(str(executable / 'native-test')) +
                              ' >' + shlex.quote(str(evidence / 'native.log')) + ' 2>&1\n' +
                              'result=$?\nprintf "%s\\n" "$result" >' +
                              shlex.quote(str(evidence / 'native.exit')) + '\nexit "$result"\n')
          launcher.chmod(0o755)
          subprocess.run(['open', '-W', '-n', str(app)], check=True, timeout=60)
          log = (evidence / 'native.log').read_text()
          print(log)
          assert (evidence / 'native.exit').read_text().strip() == '0', 'native regression failed'
          assert 'PASS: native window glass backing lifecycle and configuration' in log, 'native regression did not finish its assertions'
          PYTHON
      - name: Upload native window glass evidence
        if: always() && needs.changes.outputs.macos_gpui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: window-glass-macos
          path: ${{ runner.temp }}/window-glass
          if-no-files-found: ignore

  ios-tests:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          iphones = [device for runtime, group in devices.items() if "iOS" in runtime
                     for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator is installed")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("IOS_SIMULATOR_ID=" + iphones[0]["udid"] + "\n")
          PYTHON
      - name: Rust toolchain + iOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          key: ios-core
      - name: Rust mobile core tests
        run: cargo test --locked -p zeron-text -p zeron-markdown -p zeron-client -p zeron-mobile
      - name: Generated Swift bindings are current
        run: |
          scripts/ios/build-core.sh iphonesimulator
          git diff --exit-code -- apps/ios/Zeron/Core/Generated
      - name: Run iOS unit tests
        working-directory: apps/ios
        run: |
          xcodebuild -project Zeron.xcodeproj -scheme Zeron \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            -only-testing:ZeronTests CODE_SIGNING_ALLOWED=NO test
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore

  linux-browser:
    needs: changes
    if: needs.changes.outputs.linux_browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-ci
        with:
          # Same dependency graph as ui-tests, which saves this cache on main.
          rust-cache: ui
          apt-cache: browser
          apt-recommends: 'true'
          apt-packages: >-
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev
            libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake
            libwebkit2gtk-4.1-dev libjson-glib-dev xvfb xauth xdotool openbox
            weston ffmpeg imagemagick fonts-noto-cjk
      - name: Build browser fixture
        run: cargo build --locked -p zeron-ui --example browser-fixture --features browser-fixture
      - name: Persistent browser profiles across app launches
        timeout-minutes: 5
        run: xvfb-run -a python3 scripts/test-browser-storage.py --fixture target/debug/examples/browser-fixture
      - name: X11 and Wayland browser regressions
        timeout-minutes: 5
        env:
          RUST_LOG: gpui_wgpu=info
          BROWSER_FIXTURE_BINARY: target/debug/examples/browser-fixture
        run: |
          scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/default"
          VK_DRIVER_FILES=/dev/null scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/opengl"
      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-browser
          path: ${{ runner.temp }}/linux-browser
          if-no-files-found: warn
