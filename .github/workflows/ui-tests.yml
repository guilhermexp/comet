name: UI tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      native: ${{ steps.filter.outputs.native }}
      session_sync: ${{ steps.filter.outputs.session_sync }}
    steps:
      - uses: actions/github-script@v8
        id: filter
        with:
          script: |
            const lanes = ['ios', 'native', 'session_sync'];
            const all = value => lanes.forEach(lane => core.setOutput(lane, value));
            // Preserve full coverage for main pushes and manual runs.
            if (context.eventName !== 'pull_request') return all(true);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Run conservatively if the API did not return the full diff.
            if (files.length < context.payload.pull_request.changed_files) return all(true);
            const shared = path => ['Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml',
              '.github/workflows/ui-tests.yml'].includes(path);
            const under = (path, prefixes) => prefixes.some(prefix => path?.startsWith(prefix));
            // The app links the Rust mobile core and everything it depends on.
            const mobileCore = ['apps/ios/', 'crates/mobile/', 'crates/client/', 'crates/text/',
              'crates/markdown/', 'crates/doc/', 'crates/sync/', 'crates/proto/', 'crates/rpc/',
              'crates/syntax/', 'scripts/ios/'];
            // Native macOS/Linux fixtures: browser, preview, notifications,
            // diff font geometry and the vendored GPUI frame source.
            const nativeSurfaces = ['crates/ui/src/browser/', 'crates/ui/src/file_preview/',
              'crates/ui/src/notify.rs', 'crates/ui/src/changes.rs', 'crates/ui/examples/',
              'crates/ui/Cargo.toml', 'crates/preview/', 'third_party/zui/', 'edge/', 'dist/macos/',
              'scripts/run-macos-browser-fixture.sh', 'scripts/test-linux-browser.sh'];
            const sessionSync = ['crates/harness/', 'crates/sync/', 'crates/update/',
              'crates/engine/', 'crates/doc/', 'crates/proto/', 'crates/rpc/'];
            const touches = prefixes => files.some(file =>
              [file.filename, file.previous_filename].some(path =>
                shared(path) || under(path, prefixes)));
            core.setOutput('ios', touches(mobileCore));
            core.setOutput('native', touches(nativeSurfaces));
            core.setOutput('session_sync', touches(sessionSync));

  session-sync-regressions:
    needs: changes
    if: needs.changes.outputs.session_sync == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: OpenCode protocol and permission regressions
        run: |
          cargo test --locked -p zeron-harness --lib opencode::
          cargo test --locked -p zeron-harness --test opencode
      - name: Durable session publication and recovery
        run: |
          cargo test --locked -p zeron-sync --lib
          cargo test --locked -p zeron-update --lib
          cargo test --locked -p zeron-engine --lib --test session_publication --test restart_resume --test codex_subagents --test local_profiles

  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: GPUI system dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: UI and headless layout regressions
        run: cargo test --release --locked -p zeron-ui --lib -- --test-threads=1

  macos-frame-recovery:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            third_party/zui
      - name: Check macOS application
        run: cargo check --release --locked -p zeron
      - name: Native diff font geometry regression
        run: cargo test --release --locked -p zeron-ui --lib native_diff_font_geometry -- --test-threads=1
      - name: Native notification click regressions
        run: |
          cargo test --release --locked -p zeron-ui --lib notify::tests:: -- --test-threads=1
      - name: Build native browser fixture
        run: cargo build --release --locked -p zeron-ui --example browser-fixture --example preview-fixture --features browser-fixture
      - name: Native browser regression and screenshots
        timeout-minutes: 3
        env:
          RUST_BACKTRACE: 1
          # Give the headed CI runner time to paint a frame during the 200ms
          # sidebar transition before the fixture samples native visibility.
          ZERON_MOTION_SCALE: 1.5
        run: |
          bash scripts/run-macos-browser-fixture.sh target/release/examples/browser-fixture "$RUNNER_TEMP/browser-captures"
          test -f "$RUNNER_TEMP/browser-captures/result.txt"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-macos-captures
          path: ${{ runner.temp }}/browser-captures
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install preview fixture server
        run: npm ci --prefix edge
      - name: Project discovery, stable URLs and HMR in native WebKit
        timeout-minutes: 3
        env:
          ZERON_PREVIEW_AUTO_OPEN: 1
        run: |
          VITE_BINARY="$GITHUB_WORKSPACE/edge/node_modules/vite/bin/vite.js" bash scripts/run-macos-browser-fixture.sh target/release/examples/preview-fixture "$RUNNER_TEMP/preview-captures"
          test -f "$RUNNER_TEMP/preview-captures/result.txt"
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-macos-captures
          path: ${{ runner.temp }}/preview-captures
          if-no-files-found: ignore
      - name: Native frame-source recovery regression
        working-directory: third_party/zui
        run: cargo test --release --locked -p gpui_macos --test frame_source_recovery

  ios-tests:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          iphones = [device for runtime, group in devices.items() if "iOS" in runtime
                     for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator is installed")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("IOS_SIMULATOR_ID=" + iphones[0]["udid"] + "\n")
          PYTHON
      - name: Rust toolchain + iOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-core
      - name: Rust mobile core tests
        run: cargo test --locked -p zeron-text -p zeron-markdown -p zeron-client -p zeron-mobile
      - name: Generated Swift bindings are current
        run: |
          scripts/ios/build-core.sh iphonesimulator
          git diff --exit-code -- apps/ios/Zeron/Core/Generated
      - name: Run iOS unit tests
        working-directory: apps/ios
        run: |
          xcodebuild -project Zeron.xcodeproj -scheme Zeron \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            -only-testing:ZeronTests CODE_SIGNING_ALLOWED=NO test
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore

  linux-browser:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Native browser and GPUI dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev \
            libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake \
            libwebkit2gtk-4.1-dev libjson-glib-dev xvfb xdotool openbox \
            weston ffmpeg imagemagick fonts-noto-cjk
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build browser fixture
        run: cargo build --release --locked -p zeron-ui --example browser-fixture --features browser-fixture
      - name: X11 and Wayland browser regressions
        timeout-minutes: 5
        env:
          RUST_LOG: gpui_wgpu=info
        run: |
          scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/default"
          VK_DRIVER_FILES=/dev/null scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/opengl"
      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-browser
          path: ${{ runner.temp }}/linux-browser
          if-no-files-found: warn
