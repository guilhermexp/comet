[package]
name = "zeron-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
browser-fixture = []

[dependencies]
url.workspace = true

zeron-proto.workspace = true
similar.workspace = true
zeron-doc.workspace = true
zeron-engine.workspace = true
zeron-harness.workspace = true
zeron-rpc.workspace = true
comet-syntax.workspace = true
zeron-workers-unpeel.workspace = true
zeron-theme.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
rquickjs.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
unicode-segmentation.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
ignore.workspace = true
notify.workspace = true
calamine = "0.36.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc = "0.2"
wry.workspace = true
raw-window-handle.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-web-kit.workspace = true
reqwest.workspace = true
image.workspace = true

dispatch2 = "0.3.1"
block2 = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
image = { workspace = true, features = ["png"] }

[dev-dependencies]
zeron-preview.workspace = true
mimalloc.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# AppKit requires the process main thread; opt in on a macOS desktop.
[[test]]
name = "native_preview_focus"
harness = false
