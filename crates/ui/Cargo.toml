[package]
name = "zeron-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
project-palette-fixture = []

browser-fixture = []
windows-render-fixture = []
appshots-fixture = ["gpui_platform/test-support"]
resource-profile = ["gpui/bench", "gpui_platform/test-support"]

[[example]]
name = "macos-resource-profile"
required-features = ["resource-profile"]

[[example]]
name = "preview-fixture"
required-features = ["browser-fixture"]

[[example]]
name = "browser-fixture"
required-features = ["browser-fixture"]

[[example]]
name = "windows-render-fixture"
required-features = ["windows-render-fixture"]

[[example]]
name = "appshots-fixture"
required-features = ["appshots-fixture"]

[[example]]
name = "new-project-fixture"
required-features = ["project-palette-fixture"]

[[example]]
name = "sidebar-fixture"
required-features = ["project-palette-fixture"]

[dependencies]
url.workspace = true
zeron-proto.workspace = true
similar.workspace = true
zeron-doc.workspace = true
zeron-engine.workspace = true
zeron-harness.workspace = true
zeron-rpc.workspace = true
zeron-syntax.workspace = true
zeron-workers-unpeel.workspace = true
zeron-theme.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
gpui-base.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
rquickjs.workspace = true
zeron-markdown.workspace = true
alacritty_terminal.workspace = true
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
usvg = "0.46"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
unicode-segmentation.workspace = true
unicode-width.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
ignore.workspace = true
notify.workspace = true
calamine = "0.36.1"
roxmltree.workspace = true
png.workspace = true
thiserror.workspace = true
rust-embed = "=8.7.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc = "0.2"
wry.workspace = true
raw-window-handle.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder"] }
objc2-foundation.workspace = true
objc2-web-kit.workspace = true
reqwest.workspace = true
image.workspace = true

core-foundation.workspace = true
core-graphics.workspace = true
foreign-types.workspace = true
block.workspace = true
dispatch2 = "0.3.1"
block2 = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
atspi.workspace = true
async-io.workspace = true
x11rb.workspace = true
image = { workspace = true, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
zeron-preview.workspace = true
mimalloc.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# AppKit requires the process main thread; opt in on a macOS desktop.
[[test]]
name = "native_preview_focus"
harness = false
